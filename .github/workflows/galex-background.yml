name: GALEX background checks

on:
  push:
    paths:
      - 'galex_pipeline/**'
      - 'resolved_uv_optical/**'
      - 'tests/test_galex_background.py'
      - '.github/workflows/galex-background.yml'
  pull_request:
    paths:
      - 'galex_pipeline/**'
      - 'resolved_uv_optical/**'
      - 'tests/test_galex_background.py'
      - '.github/workflows/galex-background.yml'
  workflow_dispatch:

jobs:
  background:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package and test tools
        run: python -m pip install -e . pytest
      - name: Compile package
        run: python -m compileall -q galex_pipeline resolved_uv_optical
      - name: Run synthetic background tests
        run: python -m pytest -q tests/test_galex_background.py
